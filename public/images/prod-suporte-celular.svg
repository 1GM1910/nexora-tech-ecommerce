<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="bgGlow4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <linearGradient id="aluStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGlow4)" />
  <!-- Weighted Base -->
  <ellipse cx="400" cy="435" rx="135" ry="20" fill="#020617" opacity="0.8" />
  <rect x="290" y="405" width="220" height="24" rx="10" fill="url(#aluStand)" stroke="#475569" stroke-width="2" />
  <!-- Lower Articulated Arm -->
  <path d="M375 405 L340 285 L368 278 L405 405 Z" fill="url(#aluStand)" stroke="#475569" stroke-width="2" />
