  <circle cx="354" cy="282" r="5" fill="#22D3EE" />
  <!-- Upper Arm & Cradle -->
  <path d="M354 270 L435 190 L452 206 L368 286 Z" fill="url(#aluStand)" stroke="#475569" stroke-width="2" />
  <!-- Phone Cradle Plate -->
  <g transform="rotate(-22 440 215)">
    <rect x="415" y="120" width="22" height="170" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <path d="M437 265 L468 265 C475 265 478 258 478 250 L478 238" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>
  <text x="400" y="510" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="15" letter-spacing="4">SUPORTE ARTICULADO EM ALUMÍNIO</text>
</svg>
