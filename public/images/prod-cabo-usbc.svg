<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <linearGradient id="cyanMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGlow)" />
  <circle cx="400" cy="300" r="190" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
  <!-- Coiled braided cable loops -->
  <ellipse cx="400" cy="320" rx="150" ry="85" stroke="#1E293B" stroke-width="18" />
  <ellipse cx="400" cy="320" rx="150" ry="85" stroke="#334155" stroke-width="12" stroke-dasharray="8 4" />
  <ellipse cx="400" cy="305" rx="135" ry="74" stroke="#0F172A" stroke-width="16" />
  <ellipse cx="400" cy="305" rx="135" ry="74" stroke="#475569" stroke-width="10" stroke-dasharray="6 4" />
  <!-- Connector Left (USB-C) -->
  <g transform="translate(230, 175)">
    <rect x="0" y="24" width="28" height="14" rx="4" fill="#94A3B8" />
    <rect x="24" y="14" width="56" height="34" rx="8" fill="url(#darkMetal)" stroke="#475569" stroke-width="2" />
    <rect x="64" y="21" width="4" height="20" rx="2" fill="url(#cyanMetal)" />
    <path d="M80 31 C 120 31, 130 95, 95 135" stroke="#334155" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>
  <!-- Connector Right (USB-C) -->
  <g transform="translate(465, 175)">
    <rect x="76" y="24" width="28" height="14" rx="4" fill="#94A3B8" />
    <rect x="24" y="14" width="56" height="34" rx="8" fill="url(#darkMetal)" stroke="#475569" stroke-width="2" />
    <rect x="36" y="21" width="4" height="20" rx="2" fill="url(#cyanMetal)" />
    <path d="M24 31 C -15 31, -25 95, 10 135" stroke="#334155" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>
  <text x="400" y="510" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="15" letter-spacing="4">USB-C TURBO · 2 METROS</text>
</svg>
